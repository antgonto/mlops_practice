name: Close Stale Issues and PRs

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale items
        uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-pr-label: 'stale'
          stale-issue-message: 'This issue is stale because it has been open 60 days with no activity. It will be closed in 7 days.'
          stale-pr-message: 'This PR is stale because it has been open 60 days with no activity. It will be closed in 7 days.'
