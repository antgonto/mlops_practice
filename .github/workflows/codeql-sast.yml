name: CodeQL Advanced Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write # Required to post alerts to the PR and Security tab

# Forces Node 24 to clear the deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # v6.0.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0e150e40762c1253b364a04b0fc9f2cc14effff2 # v2.25.5
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL Analysis
        # THIS MUST EXACTLY MATCH THE INIT HASH
        uses: github/codeql-action/analyze@0e150e40762c1253b364a04b0fc9f2cc14effff2 # v2.25.5
        with:
          category: "/language:${{matrix.language}}"
